name: Database backup

# Neon's Free plan keeps only a 6-hour restore window, so this takes a backup
# every day and puts it in the same S3/R2 bucket as the files, under backups/.
# Set these repository secrets (Settings → Secrets and variables → Actions):
#   DIRECT_DATABASE_URL  — Neon's direct connection, DATABASE_URL_UNPOOLED (Vercel →
#                          project → Storage → the Neon database → .env.local tab →
#                          Show secret) with /neondb changed to /hallpass
#                          (NEON_DATABASE). Never the pooled "-pooler" host: pg_dump needs
#                          a session. Until it is updated after the move it is still the
#                          Supabase "Session pooler" URI (port 5432), which also works.
#   S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY — as in Vercel
# The pg_dump client matches the server's major version, whatever it is. The log names
# the host and provider it dumps ("Backing up the database at <host> (Neon)"), never the
# credentials, so a check after the move can tell a Neon backup from a stale Supabase one.
# Restore with:
#   pg_restore --clean --if-exists --no-owner --no-privileges -d "<Neon direct URL>" file.dump

on:
  schedule:
    - cron: "17 3 * * *" # every day, 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the connection string
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ]; then
            # A scheduled run says so once, quietly; a run by hand fails.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::warning::No backup today: the DIRECT_DATABASE_URL secret is not set (README → Daily backup to the bucket)."
              echo "SKIP_BACKUP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "DIRECT_DATABASE_URL secret is not set"
            exit 1
          fi
          case "$DIRECT_DATABASE_URL" in
            *.neon.tech/neondb|*.neon.tech/neondb\?*|*.neon.tech:[0-9]*/neondb|*.neon.tech:[0-9]*/neondb\?*)
              echo "DIRECT_DATABASE_URL names neondb, the Neon integration's own (empty) database;"
              echo "change /neondb to /hallpass (NEON_DATABASE) in the secret."
              exit 1 ;;
            *-pooler.*)
              echo "DIRECT_DATABASE_URL is Neon's pooled (-pooler) host; pg_dump needs a session."
              echo "Use DATABASE_URL_UNPOOLED from Vercel → Storage → the Neon database instead."
              exit 1 ;;
            *:6543/*|*:6543)
              echo "DIRECT_DATABASE_URL is a transaction pooler (port 6543); pg_dump needs a session."
              exit 1 ;;
            *db.*.supabase.co*)
              echo "DIRECT_DATABASE_URL points at the direct db.<ref>.supabase.co host, which is IPv6-only;"
              echo "use the Session pooler URI (…pooler.supabase.com:5432, user postgres.<ref>) instead."
              exit 1 ;;
          esac
          # The host (no credentials) and who runs it.
          REST=${DIRECT_DATABASE_URL#*://}
          AUTHORITY=${REST%%[/?]*}
          HOSTPORT=${AUTHORITY##*@}
          HOST=${HOSTPORT%%:*}
          case "$HOST" in
            *.neon.tech) PROVIDER=Neon ;;
            *.supabase.com|*.supabase.co) PROVIDER=Supabase ;;
            *) PROVIDER="another provider" ;;
          esac
          echo "Backing up the database at $HOST ($PROVIDER)"
          echo "BACKUP_SOURCE=$HOST ($PROVIDER)" >> "$GITHUB_ENV"

      - name: Install the Postgres client that matches the server
        if: env.SKIP_BACKUP != '1'
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          MAJOR=$(psql "$DIRECT_DATABASE_URL" -Atc "show server_version_num" | cut -c1-2) \
            || { echo "The database did not answer — check the URI and that the project is not suspended."; exit 1; }
          case "$MAJOR" in
            1[4-9]|2[0-9]) echo "Server major version: $MAJOR" ;;
            *) echo "Unexpected server version '$MAJOR'"; exit 1 ;;
          esac
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"
          echo "PGBIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"

      - name: Dump the database
        if: env.SKIP_BACKUP != '1'
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          "$PGBIN/pg_isready" -d "$DIRECT_DATABASE_URL" -t 20 \
            || { echo "The database did not answer — check the URI and that the project is not suspended."; exit 1; }
          STAMP=$(date -u +%Y-%m-%d)
          "$PGBIN/pg_dump" --version
          "$PGBIN/pg_dump" "$DIRECT_DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=drizzle \
            --file="hallpass-$STAMP.dump"
          ls -la hallpass-*.dump
          echo "FILE=hallpass-$STAMP.dump" >> "$GITHUB_ENV"

      - name: Check the dump can be read back
        if: env.SKIP_BACKUP != '1'
        run: |
          TABLES=$("$PGBIN/pg_restore" --list "$FILE" | grep -c " TABLE DATA " || true)
          echo "Tables with data in the dump: $TABLES"
          test "$TABLES" -ge 48 || { echo "Expected at least 48 tables; not uploading this dump."; exit 1; }

      - name: Upload to the bucket
        if: env.SKIP_BACKUP != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          test -n "$S3_BUCKET" -a -n "$S3_ENDPOINT" || { echo "S3 secrets are not set"; exit 1; }
          aws s3 cp "$FILE" "s3://$S3_BUCKET/backups/$FILE" --endpoint-url "$S3_ENDPOINT"
          echo "Backed up the database at $BACKUP_SOURCE"
          echo "Stored backups/$FILE"
