name: Database migrate

# Applies this branch's migrations (lib/db/migrations) to the live database,
# on demand only: run it before deploying a release that adds a migration
# (README → Releasing). It uses the repository secret DIRECT_DATABASE_URL —
# Neon's direct connection, DATABASE_URL_UNPOOLED (Vercel → project → Storage →
# the Neon database → .env.local tab → Show secret); never a pooled host.
# The log names the provider and host it changed, never the credentials.

on:
  workflow_dispatch:

concurrency:
  group: database-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the connection string
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          test -n "$DIRECT_DATABASE_URL" || { echo "DIRECT_DATABASE_URL secret is not set"; exit 1; }
          case "$DIRECT_DATABASE_URL" in
            *-pooler.*|*:6543/*|*:6543)
              echo "DIRECT_DATABASE_URL is a pooled connection; migrations need a direct one (DATABASE_URL_UNPOOLED)."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: pnpm db:migrate
